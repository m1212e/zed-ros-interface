name = "ROS Interface"
grammar = "ros_interface"
path_suffixes = ["msg", "srv", "action"]
line_comments = ["# "]
tab_size = 2
brackets = [
  { start = "[", end = "]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
